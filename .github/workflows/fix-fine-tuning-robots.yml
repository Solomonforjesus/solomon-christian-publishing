name: Fix Fine-Tuning Robots
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fine-tuning-robots.yml'
      - 'scripts/add_fine_tuning_robots.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/add_fine_tuning_robots.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/fine-tuning-is-only-the-beginning/index.html
          git commit -m "Explicitly index fine-tuning article"
          git push
