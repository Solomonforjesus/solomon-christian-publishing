name: Add Publishing Resource Breadcrumbs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-resource-breadcrumbs.yml'
      - 'scripts/add_resource_breadcrumbs.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add breadcrumb schema
        run: python scripts/add_resource_breadcrumbs.py
      - name: Commit breadcrumb updates
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reader/fingerprint/index.html authors/gary-dearing/index.html articles/fine-tuning-is-only-the-beginning/index.html
          git commit -m "Add breadcrumb schema to Publishing resources"
          git push
