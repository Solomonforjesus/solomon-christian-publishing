name: Connect Publishing Entity Graph

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-entity-graph.yml'
      - 'scripts/connect_entity_graph.py'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect entity graph
        run: python scripts/connect_entity_graph.py
      - name: Commit entity graph
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Connect Publishing to Solomon ecosystem entity graph"
          git push
